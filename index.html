<!DOCTYPE html><!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LDraw Viewer</title>
  <style>
    body { margin: 0; overflow: hidden; }
    #selector { position: absolute; top: 10px; left: 10px; z-index: 1; }
  </style>
</head>
<body>
  <select id="selector"></select>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.module.js";
    import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.150.1/examples/jsm/controls/OrbitControls.js";
    import { LDrawLoader } from "https://cdn.jsdelivr.net/npm/three@0.150.1/examples/jsm/loaders/LDrawLoader.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xeeeeee);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    camera.position.set(100, 200, 300);
    controls.update();

    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(1, 1, 1);
    scene.add(light);

    fetch("models/models.json")
      .then(res => res.json())
      .then(models => {
        const selector = document.getElementById("selector");
        models.forEach(name => {
          const option = document.createElement("option");
          option.value = name;
          option.textContent = name;
          selector.appendChild(option);
        });
        if (models.length > 0) loadModel(models[0]);
        selector.addEventListener("change", e => loadModel(e.target.value));
      });

    let currentModel = null;
    const loader = new LDrawLoader();

    function loadModel(file) {
      if (currentModel) {
        scene.remove(currentModel);
        currentModel = null;
      }
      loader.load("models/" + file, group => {
        currentModel = group;
        scene.add(group);
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
